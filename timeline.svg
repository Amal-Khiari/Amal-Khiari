<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="450">
  <defs>
    <style>
      .bg { fill: #0f141e; }
      
      .line { stroke: rgba(183, 110, 121, 0.3); stroke-width: 2px; }
      .node { fill: #0f141e; stroke: #b76e79; stroke-width: 4px; transition: all 0.3s; cursor: pointer; }
      .node-core { fill: #d8a7b1; animation: pulseNode 3s infinite alternate ease-in-out; }
      .node-glow { fill: url(#glow-grad); mix-blend-mode: screen; opacity: 0.6; }
      
      /* Interactivity wrapper */
      .event:hover .node { stroke: #fae3d9; stroke-width: 6px; transform: scale(1.2); }
      .event:hover .card { stroke: rgba(216, 167, 177, 0.6); }

      @keyframes pulseNode {
        0% { transform: scale(0.8); }
        100% { transform: scale(1.1); }
      }
      
      .card { fill: rgba(255, 255, 255, 0.02); stroke: rgba(183, 110, 121, 0.15); stroke-width: 1px; rx: 8px; transition: stroke 0.3s; }
      
      .year { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 800; fill: #d8a7b1; }
      .title { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; fill: #efd9d1; }
      .desc { font-family: 'Inter', sans-serif; font-size: 13px; fill: #a1a1aa; line-height: 1.5; }
    </style>
    
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b76e79" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f141e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Center Timeline Connecting Line -->
  <line x1="500" y1="50" x2="500" y2="400" class="line" />

  <!-- Event 1: Left Node -->
  <g class="event" transform="translate(0, 80)">
    <!-- Right side node connector -->
    <line x1="450" y1="20" x2="500" y2="20" class="line" />
    <!-- Node -->
    <circle cx="500" cy="20" r="16" class="node-glow" />
    <circle cx="500" cy="20" r="10" class="node" />
    <circle cx="500" cy="20" r="4" class="node-core" />
    
    <!-- Left Card -->
    <rect x="50" y="0" width="400" height="100" class="card" />
    <text x="430" y="40" class="title" text-anchor="end">Full Stack Software Engineer</text>
    <text x="430" y="60" class="year" text-anchor="end">2024 - Present</text>
    <text x="430" y="80" class="desc" text-anchor="end">Architecting microservices and sophisticated highly-scalable web tools.</text>
  </g>

  <!-- Event 2: Right Node -->
  <g class="event" transform="translate(0, 180)">
    <!-- Left side node connector -->
    <line x1="500" y1="20" x2="550" y2="20" class="line" />
    <!-- Node -->
    <circle cx="500" cy="20" r="16" class="node-glow" />
    <circle cx="500" cy="20" r="10" class="node" />
    <circle cx="500" cy="20" r="4" class="node-core" />
    
    <!-- Right Card -->
    <rect x="550" y="0" width="400" height="100" class="card" />
    <text x="570" y="40" class="title">Senior AI &amp; Web Architect Focus</text>
    <text x="570" y="60" class="year">2022 - 2024</text>
    <text x="570" y="80" class="desc">Leading backend engineering projects integrating NLP models into MERN stacks.</text>
  </g>

  <!-- Event 3: Left Node -->
  <g class="event" transform="translate(0, 280)">
    <line x1="450" y1="20" x2="500" y2="20" class="line" />
    <!-- Node -->
    <circle cx="500" cy="20" r="16" class="node-glow" />
    <circle cx="500" cy="20" r="10" class="node" />
    <circle cx="500" cy="20" r="4" class="node-core" />
    
    <!-- Left Card -->
    <rect x="50" y="0" width="400" height="100" class="card" />
    <text x="430" y="40" class="title" text-anchor="end">BSc. Computer Science</text>
    <text x="430" y="60" class="year" text-anchor="end">2018 - 2022</text>
    <text x="430" y="80" class="desc" text-anchor="end">Graduated with High Honors studying core Software Architecture paradigms.</text>
  </g>
</svg>
