<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <defs>
    <style>
      .bg { fill: transparent; }
      .bar-bg { fill: rgba(15, 23, 42, 0.6); stroke: rgba(0, 255, 136, 0.2); stroke-width: 1px; rx: 8px; }
      .bar-fill { fill: url(#grad); rx: 8px; filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.5)); transform-origin: left; }
      .text { fill: #e2e8f0; font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; }
      .text-percent { fill: #00FF88; font-family: monospace; font-size: 14px; font-weight: bold; text-anchor: end; }
      
      .python { animation: fillPython 2s ease-out forwards; }
      .java { animation: fillJava 2s ease-out forwards; animation-delay: 0.2s; transform: scaleX(0); }
      .mern { animation: fillMERN 2s ease-out forwards; animation-delay: 0.4s; transform: scaleX(0); }
      .frontend { animation: fillFrontend 2s ease-out forwards; animation-delay: 0.6s; transform: scaleX(0); }

      @keyframes fillPython { 0% { transform: scaleX(0); } 100% { transform: scaleX(0.85); } }
      @keyframes fillJava { 0% { transform: scaleX(0); } 100% { transform: scaleX(0.80); } }
      @keyframes fillMERN { 0% { transform: scaleX(0); } 100% { transform: scaleX(0.95); } }
      @keyframes fillFrontend { 0% { transform: scaleX(0); } 100% { transform: scaleX(0.90); } }
    </style>
    
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C896" />
      <stop offset="50%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Python -->
  <text x="50" y="45" class="text">Python Architecture</text>
  <text x="750" y="45" class="text-percent">85%</text>
  <rect x="50" y="55" width="700" height="16" class="bar-bg" />
  <rect x="50" y="55" width="700" height="16" class="bar-fill python" />

  <!-- Java -->
  <text x="50" y="105" class="text">Java Enterprise</text>
  <text x="750" y="105" class="text-percent">80%</text>
  <rect x="50" y="115" width="700" height="16" class="bar-bg" />
  <rect x="50" y="115" width="700" height="16" class="bar-fill java" />

  <!-- MERN Stack -->
  <text x="50" y="165" class="text">MERN Stack (MongoDB / Express / Node)</text>
  <text x="750" y="165" class="text-percent">95%</text>
  <rect x="50" y="175" width="700" height="16" class="bar-bg" />
  <rect x="50" y="175" width="700" height="16" class="bar-fill mern" />

  <!-- Frontend React -->
  <text x="50" y="225" class="text">Advanced Frontend (React / Tailwind UI)</text>
  <text x="750" y="225" class="text-percent">90%</text>
  <rect x="50" y="235" width="700" height="16" class="bar-bg" />
  <rect x="50" y="235" width="700" height="16" class="bar-fill frontend" />

</svg>
