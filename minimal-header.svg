<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Outfit:wght@300;400;500&amp;display=swap');
      
      /* Fade in animations */
      .fade-in-1 { animation: fadeIn 1.5s ease-out forwards; opacity: 0; }
      .fade-in-2 { animation: fadeIn 1.5s ease-out 0.5s forwards; opacity: 0; }
      .fade-in-3 { animation: fadeIn 1.5s ease-out 1s forwards; opacity: 0; }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Typography */
      .greeting { font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 400; fill: #d8a7b1; letter-spacing: 2px; text-transform: uppercase; }
      .name { font-family: 'Playfair Display', serif; font-size: 52px; font-weight: 600; fill: #efd9d1; letter-spacing: 1px; }
      .role { font-family: 'Playfair Display', serif; font-style: italic; font-size: 22px; fill: #b76e79; }
      .bio { font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 300; fill: #d1c5c8; line-height: 1.7; }
      
      .accent-line { stroke: #d8a7b1; stroke-width: 1; opacity: 0.4; }
    </style>
  </defs>

  <g transform="translate(40, 60)">
    <text x="0" y="0" class="greeting fade-in-1">Welcome</text>
    <text x="0" y="55" class="name fade-in-1">Amal Khiari</text>
    <text x="0" y="95" class="role fade-in-2">Full Stack Developer &amp; Creator</text>
    
    <line x1="0" y1="125" x2="60" y2="125" class="accent-line fade-in-2" />
    
    <foreignObject x="0" y="145" width="700" height="120" class="fade-in-3">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 300; color: #d1c5c8; line-height: 1.8;">
        Hello! I'm an enthusiastic software engineer driven by the desire to build beautiful, minimal, and highly functional digital experiences. I specialize in merging robust backend architectures with elegant frontend designs, putting a strong emphasis on <span style="color:#efd9d1; font-weight:400;">clean code</span> and <span style="color:#efd9d1; font-weight:400;">aesthetic perfection</span>.
      </div>
    </foreignObject>
  </g>
</svg>
