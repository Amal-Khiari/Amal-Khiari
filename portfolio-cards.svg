<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="300">
  <defs>
    <style>
      .bg { fill: #0f141e; }
      
      /* Card Wrapper Effects */
      .card { fill: rgba(255, 255, 255, 0.03); stroke: rgba(183, 110, 121, 0.2); stroke-width: 1px; rx: 16px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; transform-origin: center; }
      /* The glowing shadow behind the card */
      .card-glow { fill: url(#glow-grad); mix-blend-mode: screen; opacity: 0; transition: opacity 0.4s ease; rx: 20px; }
      
      .card-group { transform-origin: center; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      .card-group:hover .card { stroke: #d8a7b1; stroke-width: 2px; }
      .card-group:hover .card-glow { opacity: 0.8; }
      .card-group:hover { transform: scale(1.03) translateY(-5px); }
      
      .title { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 800; fill: #efd9d1; }
      .desc { font-family: 'Inter', sans-serif; font-size: 14px; fill: #a1a1aa; line-height: 1.5; }
      .link-text { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #d8a7b1; }
      
      .tag-bg { fill: rgba(183, 110, 121, 0.15); rx: 10px; }
      .tag-text { font-family: 'monospace'; font-size: 11px; fill: #fae3d9; font-weight: bold; }
      
      /* Image Placeholder */
      .img-ph { fill: #1e2430; rx: 12px; }
    </style>
    
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b76e79" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f141e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- The Interactive Project Card -->
  <!-- GitHub strips active HTML links inside pure SVG, but we use Markdown wrappers later. The :hover CSS still works cleanly here. -->
  <g transform="translate(100, 40)" class="card-group">
    <!-- Drop Shadow / Glow -->
    <rect x="-10" y="-10" width="820" height="240" class="card-glow" />
    
    <!-- Main Card Body -->
    <rect width="800" height="220" class="card" />
    
    <!-- Image/Preview Wrapper -->
    <g transform="translate(20, 20)">
      <rect width="320" height="180" class="img-ph" />
      <!-- SVG Drawing to represent the 'Dream Home' UI layout elegantly -->
      <rect x="20" y="20" width="280" height="70" rx="6" fill="#0f141e" stroke="rgba(216, 167, 177, 0.3)" />
      <rect x="35" y="35" width="60" height="40" rx="4" fill="#b76e79" opacity="0.5" />
      <rect x="110" y="40" width="100" height="8" rx="4" fill="#efd9d1" />
      <rect x="110" y="55" width="160" height="6" rx="3" fill="#a1a1aa" />
      
      <rect x="20" y="100" width="130" height="60" rx="6" fill="#0f141e" stroke="rgba(216, 167, 177, 0.3)" />
      <rect x="160" y="100" width="140" height="60" rx="6" fill="#0f141e" stroke="rgba(216, 167, 177, 0.3)" />
    </g>
    
    <!-- Content Segment -->
    <g transform="translate(370, 30)">
      <text x="0" y="20" class="title">Dream Home Platform</text>
      
      <foreignObject x="0" y="40" width="400" height="80">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Inter', sans-serif; font-size: 14px; color: #a1a1aa; line-height: 1.6;">
          An ultra-premium real estate architecture natively built to visualize properties dynamically. Incorporates glassmorphism and modern Rose Gold UI/UX for absolute immersion.
        </div>
      </foreignObject>

      <!-- Tags Array -->
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="55" height="20" class="tag-bg" />
        <text x="9" y="14" class="tag-text">React</text>
        
        <rect x="65" y="0" width="70" height="20" class="tag-bg" />
        <text x="75" y="14" class="tag-text">Node.js</text>
        
        <rect x="145" y="0" width="70" height="20" class="tag-bg" />
        <text x="154" y="14" class="tag-text">MongoDB</text>
        
        <rect x="225" y="0" width="60" height="20" class="tag-bg" />
        <text x="235" y="14" class="tag-text">ThreeJS</text>
      </g>
      
      <!-- Fake "Explore" button -->
      <g transform="translate(0, 150)">
        <text x="0" y="15" class="link-text">Explore Project Architecture →</text>
        <rect x="0" y="22" width="200" height="1" fill="#b76e79" />
      </g>
    </g>
  </g>
</svg>
